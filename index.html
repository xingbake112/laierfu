<script>
/* =========================================================
   ★★★★★ 所有要修改的內容都在這裡 ★★★★★
   之後你只需要改這一區，不用動下面的程式。
   ========================================================= */

const CONFIG = {
  /* 頁籤標題 */
  pageTitle: "萊爾富限定優惠券活動",

  /* 主圖：圖片和 html 放同一個資料夾 */
  heroImage: "image.png",
  heroAlt: "萊爾富限定優惠券活動",

  /* 上方文字 */
  eyebrow: "萊爾富限定優惠券活動",
  title: "限定優惠券折抵200元優惠券",
  subtitle: "。",
  /* 資訊卡 */
  rewardLabel: "活動概念",
  rewardText: "限定優惠券折抵200",

  timeLabel: "展示日期",
  timeText: "2026/10/23 00:00 ～ 2026/10/28 23:59",

  /* 活動資訊區塊（保留原本版型與欄位） */
  claimTag: "萊爾富限定優惠券活動",
  claimTitleLine1: "",
  claimTitleLine2: "200元優惠券",
  claimDesc: "200元優惠券。",
  claimButtonText: "查看萊爾富官方活動",
  claimSafeText: "查看萊爾富官方活動",

  /* ★ 官方活動查詢連結（保留原有 lineLink 欄位與按鈕綁定方式） */
  lineLink: "https://lin.ee/VlIfPA4",

  /* 底部小字 */
  footerText: "※ "
};
</script>

<title></title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    "PingFang TC",
    Arial,
    sans-serif;
  background:#06080b;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 2%, rgba(255,49,73,.16), transparent 24%),
    radial-gradient(circle at 92% 24%, rgba(255,49,73,.10), transparent 28%),
    radial-gradient(circle at 10% 88%, rgba(255,49,73,.07), transparent 24%),
    linear-gradient(145deg,#06080b 0%, #0a0e13 55%, #10070c 100%);
}

.bg-grid{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.10;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom, black, rgba(0,0,0,.15));
}

.glow{
  position:fixed;
  border-radius:50%;
  filter:blur(88px);
  pointer-events:none;
  z-index:0;
}
.glow.one{
  width:260px;height:260px;top:-110px;right:-70px;
  background:rgba(255,44,66,.20);
}
.glow.two{
  width:230px;height:230px;bottom:90px;left:-90px;
  background:rgba(255,30,52,.14);
}

.page{
  width:min(100%, 760px);
  margin:0 auto;
  padding:18px 16px 40px;
  position:relative;
  z-index:1;
}

.hero{
  overflow:hidden;
  border-radius:22px;
  border:1px solid rgba(255,86,102,.28);
  background:#0a0d12;
  box-shadow:
    0 18px 48px rgba(0,0,0,.50),
    0 0 28px rgba(255,38,56,.10);
}
.hero img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:16/9;
  object-fit:cover;
}

.intro{
  margin-top:22px;
  text-align:center;
  padding:0 8px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,50,73,.08);
  border:1px solid rgba(255,73,94,.34);
  color:#ff6a7c;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.16em;
}
.eyebrow::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:#ff334b;
  box-shadow:0 0 10px #ff334b;
}

h1{
  margin:14px 0 8px;
  font-size:36px;
  line-height:1.12;
  font-weight:1000;
  letter-spacing:-.03em;
  text-shadow:0 0 18px rgba(255,45,68,.16);
}
.subtitle{
  width:min(100%, 600px);
  margin:0 auto;
  color:#b9c0ca;
  font-size:14px;
  line-height:1.8;
}

.info{
  margin-top:24px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg, rgba(19,23,30,.96), rgba(9,11,15,.96));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 15px 38px rgba(0,0,0,.32);
}
.row{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:13px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
}
.row + .row{margin-top:10px}
.label{
  flex:0 0 84px;
  color:#ff6d7d;
  font-size:13px;
  font-weight:900;
}
.value{
  flex:1;
  color:#f5f7fa;
  font-size:14px;
  line-height:1.56;
  word-break:break-word;
}

/* ===== 領取區塊：改成參考圖那種字體視覺 ===== */
.claim-panel{
  margin-top:22px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg, #101215, #0a0b0d);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 20px 46px rgba(0,0,0,.42);
}
.claim-tag{
  color:#ffe44f;
  font-size:13px;
  font-weight:1000;
  letter-spacing:.10em;
  text-transform:uppercase;
}
.claim-title{
  margin-top:12px;
  font-weight:1000;
  line-height:1.10;
  letter-spacing:-.03em;
  color:#fff;
}
.claim-title .line1{
  display:block;
  font-size:40px;
}
.claim-title .line2{
  display:block;
  margin-top:4px;
  font-size:40px;
}
.claim-desc{
  margin-top:14px;
  color:#c8cbd1;
  font-size:14px;
  line-height:1.75;
  max-width:560px;
}
.claim-button-wrap{
  margin-top:22px;
}
.claim-button{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:#f3f3f4;
  color:#101113;
  font-size:20px;
  font-weight:1000;
  letter-spacing:.02em;
  box-shadow:
    0 8px 22px rgba(0,0,0,.20),
    0 0 0 1px rgba(255,255,255,.10) inset;
  transition:transform .16s ease, filter .16s ease;
}
.claim-button::after{
  content:"→";
  margin-left:10px;
  font-size:22px;
}
.claim-button:hover{filter:brightness(1.03)}
.claim-button:active{transform:scale(.988)}

.claim-safe{
  margin-top:12px;
  text-align:center;
  color:#9ea4ae;
  font-size:12px;
  font-weight:800;
}
.claim-safe::before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:7px;
  border-radius:50%;
  background:#22db79;
  box-shadow:0 0 8px #22db79;
  vertical-align:middle;
}

.footer{
  margin-top:14px;
  text-align:center;
  color:#767e8a;
  font-size:11px;
  line-height:1.6;
}

@media(max-width:560px){
  .page{padding:12px 10px 32px}
  .hero{border-radius:16px}
  h1{font-size:31px}
  .info{padding:13px}
  .row{gap:10px;padding:12px}
  .label{flex-basis:72px;font-size:12px}
  .value{font-size:13px}
  .claim-panel{padding:18px;border-radius:20px}
  .claim-title .line1,
  .claim-title .line2{font-size:32px}
  .claim-button{font-size:18px;min-height:54px}
}

/* 萊爾富海報靈感背景：柔粉、奶油白、品牌紅與海洋藍；保留原有排版、元件及 16:9 主圖 */
body { background:#fff6f8; }
body::before {
  background:
    radial-gradient(ellipse at 12% 8%, rgba(255,98,143,.21), transparent 36%),
    radial-gradient(ellipse at 88% 20%, rgba(91,174,246,.14), transparent 33%),
    radial-gradient(ellipse at 25% 92%, rgba(255,198,94,.18), transparent 39%),
    linear-gradient(155deg,#fffafb 0%,#fff0f4 53%,#f5faff 100%);
}
.bg-grid { opacity:.18; background-image:repeating-linear-gradient(35deg,rgba(227,70,112,.09) 0 1px,transparent 1px 44px); mask-image:none; }
.glow.one { background:rgba(251,82,124,.20); }
.glow.two { background:rgba(96,171,243,.17); }
/* 原本的結構、字級與間距不變，僅換成與主圖呼應的配色 */
.hero { position:relative; border-color:rgba(235,50,89,.35); box-shadow:0 18px 48px rgba(136,55,83,.16),0 0 28px rgba(255,70,119,.09); }
.hero::after {
  content:"";
  position:absolute;
  right:12px;
  bottom:12px;
  padding:7px 12px;
  border-radius:999px;
  color:#fff;
  background:rgba(151,17,48,.92);
  border:1px solid rgba(255,255,255,.8);
  font-size:12px;
  font-weight:900;
  letter-spacing:.06em;
}
.eyebrow { background:rgba(255,56,105,.09);border-color:rgba(242,51,98,.28);color:#bf2350; }
.eyebrow::before { background:#f1396a;box-shadow:0 0 10px rgba(241,57,106,.4); }
h1 { color:#d71d50;text-shadow:none; }
.subtitle { color:#665564; }
.info { border-color:rgba(248,125,157,.30); background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,246,250,.98)); box-shadow:0 15px 38px rgba(131,40,78,.10); }
.row { background:rgba(255,91,133,.055); }
.label { color:#d5275c; }
.value { color:#3d3040; }
.claim-panel { background:linear-gradient(145deg,#fff,#fff0f5);border-color:rgba(248,125,157,.35);box-shadow:0 20px 46px rgba(135,46,81,.12); }
.claim-tag { color:#c31f4b; }
.claim-title { color:#d51b50; }
.claim-desc { color:#665564; }
.claim-button { background:#e71f54;color:#fff;box-shadow:0 8px 22px rgba(210,32,82,.19),0 0 0 1px rgba(255,255,255,.15) inset; }
.claim-safe { color:#9d4c64; }
.claim-safe::before { background:#ed5980;box-shadow:0 0 8px #ed5980; }
.footer { color:#8a6070; }

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="page">

  <section class="hero">
    <img id="hero-image" alt="">
  </section>

  <section class="intro">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </section>

  <section class="info">
    <div class="row">
      <div class="label" id="reward-label"></div>
      <div class="value" id="reward-text"></div>
    </div>
    <div class="row">
      <div class="label" id="time-label"></div>
      <div class="value" id="time-text"></div>
    </div>
  </section>

  <section class="claim-panel">
    <div class="claim-tag" id="claim-tag"></div>

    <div class="claim-title">
      <span class="line1" id="claim-line1"></span>
      <span class="line2" id="claim-line2"></span>
    </div>

    <div class="claim-desc" id="claim-desc"></div>

    <div class="claim-button-wrap">
      <a
        id="claim-button"
        class="claim-button"
        href="#"
        rel="noopener noreferrer">
      </a>
    </div>

    <div class="claim-safe" id="claim-safe"></div>
  </section>

  <div class="footer" id="footer"></div>

</main>

<script>
const $ = (id) => document.getElementById(id);

document.title = CONFIG.pageTitle;

$("hero-image").src = CONFIG.heroImage;
$("hero-image").alt = CONFIG.heroAlt;

$("eyebrow").textContent = CONFIG.eyebrow;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

$("reward-label").textContent = CONFIG.rewardLabel;
$("reward-text").textContent = CONFIG.rewardText;

$("time-label").textContent = CONFIG.timeLabel;
$("time-text").textContent = CONFIG.timeText;


$("claim-tag").textContent = CONFIG.claimTag;
$("claim-line1").textContent = CONFIG.claimTitleLine1;
$("claim-line2").textContent = CONFIG.claimTitleLine2;
$("claim-desc").textContent = CONFIG.claimDesc;
$("claim-button").textContent = CONFIG.claimButtonText;
$("claim-button").href = CONFIG.lineLink;
$("claim-safe").textContent = CONFIG.claimSafeText;

$("footer").textContent = CONFIG.footerText;
</script>

</body>
</html>
